  <title>Cancelar reserva — Sir Fisher</title>
  <!-- Idioma: ?lang=en|pt, depois a escolha salva, depois o navegador. Em
       ingles a pagina fica oculta ate o i18n.js trocar os textos (no maximo
       2,5 s), para o portugues nao piscar. Mesma regra de assets/js/i18n.js. -->
  <style>.i18n-pending body { visibility: hidden; }</style>
  <script>
  (function () {
    var raiz = document.documentElement;
    var l = 'pt';
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var salvo = null;
      try { salvo = localStorage.getItem('sf-lang'); } catch (e) {}
      if (q === 'en' || q === 'pt') l = q;
      else if (salvo === 'en' || salvo === 'pt') l = salvo;
      else if (/^en\b/i.test(navigator.language || '')) l = 'en';
    } catch (e) {}
    raiz.setAttribute('data-lang', l);
    if (l === 'en') {
      raiz.setAttribute('lang', 'en');
      raiz.classList.add('i18n-pending');
      setTimeout(function () { raiz.classList.remove('i18n-pending'); }, 2500);
    }
  })();
  </script>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="https://www.sirfisher.com.br/assets/img/favicon.png" />
  <link rel="stylesheet" href="./assets/css/style.css?v=20261007" />
  <!-- Google tag (gtag.js). Mesma propriedade do site institucional. O linker
       preserva a sessao quando o visitante salta de www.sirfisher.com.br para
       este subdominio, para que a reserva seja creditada ao canal de origem. -->

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F40Z5Y9QT6', {
      linker: { domains: ['sirfisher.com.br', 'www.sirfisher.com.br', 'reservas.sirfisher.com.br'] }
    });
  </script>
  <!-- Meta Pixel. O mesmo dataset da Conversions API: os eventos do navegador e

    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '948509834960152');
